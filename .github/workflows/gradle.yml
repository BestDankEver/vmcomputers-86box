# Builds the mod jar on every push. Download it from the run's "Artifacts".
name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build
        # The jar points at this repository's nightly 86Box releases.
        run: gradle build --stacktrace -Pnightly_repo=${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: vmcomputers-86box-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
