plugins {
	id 'fabric-loom' version '1.7-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// JNA (used to hide 86Box's window on Windows) ships with Minecraft itself.
}

processResources {
	inputs.property "version", project.version
	inputs.property "nightly_repo", project.nightly_repo

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
	filesMatching("mcvmcomputers.properties") {
		expand "nightly_repo": project.nightly_repo
	}
}

// Minecraft 1.20.1 runs on Java 17.
tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

// Everything the mod compiles against, in one folder (see .github/workflows/dev-classpath.yml).
tasks.register('exportDevClasspath', Copy) {
	from(sourceSets.main.compileClasspath)
	into(layout.buildDirectory.dir('devlibs'))
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}
