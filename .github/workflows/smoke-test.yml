# Starts a dev server and a real client (virtual display) with the mod, takes
# screenshots and collects logs into a draft release "smoke-test" (drafts are
# only visible to collaborators). Runs when tools/smoke changes, or by hand.
name: Smoke test

on:
  workflow_dispatch:
  push:
    branches: ["1.20.1"]
    paths: ["tools/smoke/**", ".github/workflows/smoke-test.yml"]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install a virtual display and screenshot tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb imagemagick xdotool mesa-utils libgl1-mesa-dri
      - name: Prepare
        run: gradle build -x test
      - name: Run
        run: bash tools/smoke/run.sh
      - name: Publish as a draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete smoke-test --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create smoke-test --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Smoke test (delete me)" --notes "Draft: not public." out/*
