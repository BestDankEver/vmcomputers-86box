plugins {
	id 'fabric-loom' version '1.7-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// JNA (used to hide 86Box's window on Windows) ships with Minecraft itself.
}

processResources {
	inputs.property "version", project.version
	inputs.property "nightly_repo", project.nightly_repo

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
	filesMatching("mcvmcomputers.properties") {
		expand "nightly_repo": project.nightly_repo
	}
}

// Minecraft 1.16.5 runs on Java 8, so the mod is compiled for Java 8
// (Gradle and Loom themselves need Java 17 or newer to run).
tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 8
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}
